<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="미노의 AI 탐험대 시즌 2 — 좋아요 버튼부터 휴리스틱까지. AI 에이전트 훈련, 기억, 자동화, 편향을 웹툰으로 탐험하다.">
  <title>미노의 AI 탐험대 시즌 2 | Myno's Blog</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      overflow: hidden;
      height: 100dvh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      font-family: 'Pretendard', sans-serif;
      color: #fff;
    }

    /* Top bar */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: linear-gradient(180deg, rgba(26,26,46,0.95) 0%, rgba(26,26,46,0) 100%);
      transition: opacity 0.3s;
    }
    .top-bar.hidden { opacity: 0; pointer-events: none; }
    .top-bar a { color: rgba(255,255,255,0.7); text-decoration: none; font-size: 14px; }
    .top-bar a:hover { color: #fff; }
    .top-bar .page-info {
      font-size: 14px;
      color: rgba(255,255,255,0.8);
      background: rgba(255,255,255,0.1);
      padding: 4px 14px;
      border-radius: 20px;
    }
    .top-bar .back-home { font-size: 14px; }

    /* Image container */
    .viewer {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .viewer img {
      max-width: 100%;
      max-height: 100dvh;
      object-fit: contain;
      transition: opacity 0.2s;
    }
    .viewer img.loading { opacity: 0.3; }

    /* Nav zones */
    .nav-zone {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 30%;
      z-index: 50;
      cursor: pointer;
    }
    .nav-zone.left { left: 0; }
    .nav-zone.right { right: 0; }

    /* Bottom bar */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 12px 16px 16px;
      background: linear-gradient(0deg, rgba(26,26,46,0.95) 0%, rgba(26,26,46,0) 100%);
      transition: opacity 0.3s;
    }
    .bottom-bar.hidden { opacity: 0; pointer-events: none; }

    .progress-bar {
      width: 100%;
      height: 3px;
      background: rgba(255,255,255,0.15);
      border-radius: 2px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #9b6baf;
      border-radius: 2px;
      transition: width 0.3s;
    }

    .ep-label {
      text-align: center;
      font-size: 13px;
      color: rgba(255,255,255,0.5);
    }

    /* Episode divider overlay */
    .ep-divider-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(26,26,46,0.97);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
    }
    .ep-divider-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .ep-divider-overlay .ep-num-big {
      font-size: 72px;
      font-weight: 800;
      color: #9b6baf;
      line-height: 1;
    }
    .ep-divider-overlay .ep-title-big {
      font-size: 20px;
      color: rgba(255,255,255,0.8);
      margin-top: 12px;
      text-align: center;
      padding: 0 32px;
    }
    .ep-divider-overlay .ep-sub-big {
      font-size: 14px;
      color: rgba(255,255,255,0.4);
      margin-top: 8px;
    }
    .ep-divider-overlay .tap-hint {
      position: absolute;
      bottom: 60px;
      font-size: 13px;
      color: rgba(255,255,255,0.3);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }
  </style>
</head>
<body>

  <div class="top-bar hidden" id="topBar">
    <a href="https://sfex11.github.io/Myno_public/#myno-news" class="back-home">← 홈</a>
    <span class="page-info" id="pageInfo">EP.7 — 1 / 6</span>
    <a href="expedition-s1.html">S1 →</a>
  </div>

  <div class="viewer" id="viewer">
    <img id="mainImg" src="" alt="미노의 AI 탐험대">
  </div>

  <div class="nav-zone left" id="navLeft"></div>
  <div class="nav-zone right" id="navRight"></div>

  <div class="bottom-bar hidden" id="bottomBar">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="ep-label" id="epLabel">EP.7 좋아요 버튼이 숨긴 세 가지 거짓말</div>
  </div>

  <div class="ep-divider-overlay" id="epDivider">
    <div class="ep-num-big" id="divNum">EP.7</div>
    <div class="ep-title-big" id="divTitle">좋아요 버튼이 숨긴 세 가지 거짓말</div>
    <div class="ep-sub-big" id="divSub">RLHF와 보상의 함정</div>
    <div class="tap-hint">탭하여 시작</div>
  </div>

  <script>
    const episodes = [
      { num: 7, title: "좋아요 버튼이 숨긴 세 가지 거짓말", sub: "RLHF와 보상의 함정", prefix: "ep07" },
      { num: 8, title: "AI를 위한 체육관", sub: "ClawGym과 에이전트 훈련", prefix: "ep08" },
      { num: 9, title: "AI의 스마트한 게임 세이브", sub: "메모리 전략과 Crab", prefix: "ep09" },
      { num: 10, title: "세 번의 시선으로 길을 찾다", sub: "Three-Step Nav", prefix: "ep10" },
      { num: 11, title: "파이프라인이 길어질수록 깨지는 것들", sub: "자동화의 역설", prefix: "ep11" },
      { num: 12, title: "휴리스틱의 세 얼굴", sub: "인간과 AI의 결정 편향", prefix: "ep12" },
    ];

    const BASE = "../assets/expedition/";
    let curEp = 0;
    let curPage = 0;
    let showUI = true;
    let hideTimer;
    let dividerShown = false;

    const mainImg = document.getElementById("mainImg");
    const pageInfo = document.getElementById("pageInfo");
    const progressFill = document.getElementById("progressFill");
    const epLabel = document.getElementById("epLabel");
    const topBar = document.getElementById("topBar");
    const bottomBar = document.getElementById("bottomBar");
    const epDivider = document.getElementById("epDivider");

    function imgSrc(epIdx, page) {
      return BASE + episodes[epIdx].prefix + "-p" + String(page + 1).padStart(2, "0") + ".png";
    }

    function totalPages() { return episodes.length * 6; }
    function flatIndex() { return curEp * 6 + curPage; }

    function update() {
      const src = imgSrc(curEp, curPage);
      mainImg.classList.add("loading");
      const img = new Image();
      img.onload = () => { mainImg.src = src; mainImg.classList.remove("loading"); };
      img.onerror = () => { mainImg.src = src; mainImg.classList.remove("loading"); };
      img.src = src;

      pageInfo.textContent = "EP." + episodes[curEp].num + " — " + (curPage + 1) + " / 6";
      progressFill.style.width = ((flatIndex() + 1) / totalPages() * 100) + "%";
      epLabel.textContent = "EP." + episodes[curEp].num + " " + episodes[curEp].title;

      showDivider(curEp);
    }

    function showDivider(epIdx) {
      if (epIdx === curEp && dividerShown) return;
      dividerShown = true;
      document.getElementById("divNum").textContent = "EP." + episodes[epIdx].num;
      document.getElementById("divTitle").textContent = episodes[epIdx].title;
      document.getElementById("divSub").textContent = episodes[epIdx].sub;
      epDivider.classList.add("show");
    }

    function dismissDivider() {
      if (!epDivider.classList.contains("show")) return false;
      epDivider.classList.remove("show");
      return true;
    }

    function goNext() {
      if (dismissDivider()) return;
      if (curPage < 5) {
        curPage++;
        update();
      } else if (curEp < episodes.length - 1) {
        curEp++;
        curPage = 0;
        dividerShown = false;
        update();
      }
    }

    function goPrev() {
      if (dismissDivider()) return;
      if (curPage > 0) {
        curPage--;
        update();
      } else if (curEp > 0) {
        curEp--;
        curPage = 5;
        dividerShown = false;
        update();
      }
    }

    function toggleUI() {
      showUI = !showUI;
      topBar.classList.toggle("hidden", !showUI);
      bottomBar.classList.toggle("hidden", !showUI);
      if (showUI) {
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => {
          showUI = false;
          topBar.classList.add("hidden");
          bottomBar.classList.add("hidden");
        }, 3000);
      }
    }

    // Touch / click
    let touchStartX = 0;
    document.addEventListener("touchstart", e => { touchStartX = e.touches[0].clientX; }, { passive: true });
    document.addEventListener("touchend", e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 50) {
        dx < 0 ? goNext() : goPrev();
      } else {
        // tap
        const x = e.changedTouches[0].clientX;
        const w = window.innerWidth;
        if (x < w * 0.3) goPrev();
        else if (x > w * 0.7) goNext();
        else toggleUI();
      }
    });

    document.getElementById("navLeft").addEventListener("click", e => { e.stopPropagation(); goPrev(); });
    document.getElementById("navRight").addEventListener("click", e => { e.stopPropagation(); goNext(); });

    // Keyboard
    document.addEventListener("keydown", e => {
      if (e.key === "ArrowRight" || e.key === " ") goNext();
      else if (e.key === "ArrowLeft") goPrev();
      else if (e.key === "Escape") toggleUI();
    });

    // Init
    update();
    // Auto-show UI briefly
    setTimeout(() => { topBar.classList.remove("hidden"); bottomBar.classList.remove("hidden"); }, 100);
    hideTimer = setTimeout(() => { showUI = false; topBar.classList.add("hidden"); bottomBar.classList.add("hidden"); }, 3000);
  </script>
</body>
</html>
